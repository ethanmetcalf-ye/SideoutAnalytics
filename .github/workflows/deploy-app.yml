name: Build and Deploy Docker Image

on:
    workflow_run:
        workflows: ['Sideout Analytics CI']
        types: [completed]
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
  publish:
    # publish only a CI pass on a push to this repo, never a PR (a fork's PR from a branch named main matches branches: [main])
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
            ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: boot docker builder
        uses: docker/setup-buildx-action@v3

      - name: ghcr login
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN}}

      - name: set image meta data
        id: meta
        uses: docker/metadata-action@v5
        with:
            images: ghcr.io/${{ github.repository }}
            tags: |
              type=sha,format=long
              type=raw,value=latest

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
            context: .
            push: true
            platforms: linux/arm64
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-24.04-arm
    permissions:
        id-token: write
        contents: read
    env:
        SHA: ${{ github.event.workflow_run.head_sha || github.sha}}
    steps:
      - name: configure AWS creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
            role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARM }}
            aws-region: ${{ vars.AWS_REGION}}
      - name: deploy on aws server
        run: |
          id=$(aws ssm send-command) \
          --instance-ids "${{ vars.EC2_INSTNANCE_ID }}" \
          --document-name AWS-RUNShellScript \
          --comment "deploy $SHA" \
          --parameters commands="[\"runuser -u ubuntu -- bash -lc 'set -euo pipefail; cd /opt/sideout/app && git fetch -q origin && git checkout -q --detach $SHA && cd deploy && APP_TAG=sha-$SHA docker compose pull && APP_TAG=sha-$SHA docker compose up -d --wait'\"]" \
          --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{status: Status, out: StandardOutputContent, err: StandardErrorContent}'
          test "$(aws ssm get-command-invocation --command-id "$id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text)" = Success

