# This workflow will create a Postgres container, install Python dependencies, run tests and lint with a single version of Python

name: Sideout Analytics CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: sideout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d sideout_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Downloads a copy of the code in your repository before running CI tests
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up uv and python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
  
      - name: Install dependencies
        run: uv sync --locked

      - name: Run linter
        run: uv run ruff check . && uv run ruff format --check .

      - name: Migrate a fresh DB
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci_password@localhost:5432/sideout_test
          DATA_DIRECTORY: /tmp/data
        run: uv run alembic upgrade head && uv run alembic check

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ci:ci_password@localhost:5432/sideout_test
          REQUIRE_TEST_DB: 1
        run: uv run pytest
