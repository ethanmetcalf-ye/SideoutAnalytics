name: sideout
services:
  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
  postgres:
    image: postgres:17.11
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  migrate:
    # the deploy workflow sets APP_TAG=sha-<commit>; by hand it falls back to latest
    image: ghcr.io/ethanmetcalf-ye/sideoutanalytics:${APP_TAG:-latest}
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: ghcr.io/ethanmetcalf-ye/sideoutanalytics:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
  scheduler:
    image: ghcr.io/ethanmetcalf-ye/sideoutanalytics:${APP_TAG:-latest}
    env_file: .env
    command: ["supercronic", "/app/deploy/crontab"]
    restart: unless-stopped
    volumes:
      - rawpipeline_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  rawpipeline_data:
