[project]
name = "sideout-analytics"
version = "0.1.0"
description = "Tools for analyzing and visualizing NCAA women's volleyball data."
readme = "README.md"
authors = [
    { name = "Ethan", email = "ethanmetcalf22@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
]

[project.scripts]
sideout-analytics = "sideout_analytics:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]


[tool.pytest]
minversion = "9.1.1"
addopts = ["-ra", "-q"]
testpaths = [
    "tests"
]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 79

[tool.ruff.lint]
extend-select = ["F", "S", "I", "PERF", "E", "W", "UP", "N", "ANN", "DTZ", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
    "ANN",
]
